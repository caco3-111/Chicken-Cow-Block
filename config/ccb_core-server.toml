[ffb]
	#Special namae ichi.
	namaeIchi = "哈吉仙"
	#Special namae ni.
	namaeNi = "哈基仙"
	#Special namae no chance no multiplier.
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	chanceMultiplier = 10.0
	#Special namae no color.
	# Default: 16777215
	# Range: 0 ~ 16777215
	namaeColor = 16755200

[de]
	#MaxResistForCoreReduction. Default: 1000000.0
	# Default: 1000000.0
	# Range: 25.0 ~ 3.4028234663852886E38
	maxResistForCoreReduction = 1.0E7

[roost]
	#Energy per tick for generated recipes. Default: 16
	# Default: 16
	# Range: > 1
	energy = 16
	#Duration multiplier for generated recipes. Default: 0.5
	# Default: 0.5
	# Range: 0.0 ~ 2.147483647E9
	durationMultiplier = 0.5
	#How the multipliers of all speed hatches are combined.
	#"add"      -> 1 + (m1 - 1) + (m2 - 1) + ...
	#"multiply" -> m1 * m2 * ...
	#"max"      -> max(m1, m2, ...), multiple hatches do not stack
	#Unknown values fall back to "multiply". Default: multiply
	mode = "multiply"
	#Item id of the chicken that produces EU instead of items.
	#Leave empty to disable energy production. Default: chicken_roost:c_electric
	electricChicken = "chicken_roost:c_electric"
	#EU produced by one electric chicken per production cycle, before the level and parallel multipliers.
	#Set to 0 to disable energy production. Default: 1024
	# Default: 1024
	# Range: 0 ~ 9223372036854775807
	electricAmount = 1024
	#Item produced by one lv0 chicken per production cycle. Default: 1
	# Default: 1
	# Range: > 0
	itemAmount = 1

[HCE]
	#Duration for generated recipes. Default: 72000
	# Default: 72000
	# Range: > 1
	duration = 72000
	#Energy per tick for generated recipes. Default: 1000000
	# Default: 1000000
	# Range: > 1
	energy = 1000000
	#Item amount for generated recipes. Default: 2147483647
	# Default: 2147483647
	# Range: > 1
	itemAmount = 2147483647
	#Fluid amount for generated recipes. Default: 2147483647
	# Default: 2147483647
	# Range: > 1
	fluidAmount = 2147483647

[trainer]
	#Duration multiplier for one training cycle. Default: 1.0
	# Default: 1.0
	# Range: 0.0 ~ 2.147483647E9
	durationMultiplier = 1.0
	#Energy per tick consumed by the trainer multiblock. Default: 32
	# Default: 32
	# Range: > 1
	energy = 32
	#Chickens reaching this level are pushed to the output hatch. Use -1 to only output max level chickens. Default: 128
	# Default: 128
	# Range: > -1
	autoOutputLevel = 128

[miRecipe]
	#Multiplies the duration of EVERY Modern Industrialization MachineRecipe by this value. Default: 1.0
	# Default: 1.0
	# Range: 0.0 ~ 2.147483647E9
	durationMultiplier = 0.5

[cow]
	#How the multipliers of all speed hatches are combined.
	#"add"      -> 1 + (m1 - 1) + (m2 - 1) + ...
	#"multiply" -> m1 * m2 * ...
	#"max"      -> max(m1, m2, ...), multiple hatches do not stack
	#Unknown values fall back to "multiply". Default: multiply
	mode = "multiply"
	#Duration for generated recipes. Default: 200
	# Default: 200
	# Range: > 1
	duration = 200
	#Fluid produced by one cow per production cycle, in mB. Default: 1000
	# Default: 1000
	# Range: > 1
	fluidAmount = 1000
	#Energy per tick for generated recipes. Default: 16
	# Default: 16
	# Range: > 1
	energy = 16
