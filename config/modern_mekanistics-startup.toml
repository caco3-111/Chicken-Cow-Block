[hatches]
	#Chemical capacity of the Bronze Chemical Input/Output Hatch, in buckets
	# Default: 4
	# Range: 1 ~ 1000000
	bronze_capacity = 4
	#Chemical capacity of the Steel Chemical Input/Output Hatch, in buckets
	# Default: 16
	# Range: 1 ~ 1000000
	steel_capacity = 16
	#Chemical capacity of the Turbo (HV) Chemical Input/Output Hatch, in buckets
	# Default: 256
	# Range: 1 ~ 1000000
	turbo_capacity = 256
	#Chemical capacity of the Advanced (MV) Chemical Input/Output Hatch, in buckets
	# Default: 64
	# Range: 1 ~ 1000000
	advanced_capacity = 64
	#Chemical capacity of the Highly Advanced (EV) Chemical Input/Output Hatch, in buckets
	# Default: 1024
	# Range: 1 ~ 1000000
	highly_advanced_capacity = 1024

[steam_chemical]
	#Fluid capacity of each fluid slot of the Steam Chemical machines, in mB
	# Default: 0
	# Range: 0 ~ 9223372036854775807
	fluid_capacity = 0
	#Internal steam buffer of the Steel Steam Chemical machine, in mB
	# Default: 4000
	# Range: 1 ~ 9223372036854775807
	steam_capacity_steel = 4000
	#Chemical capacity of each chemical slot of the Steam Chemical machines, in mB
	# Default: 4000
	# Range: 1 ~ 9223372036854775807
	chemical_capacity = 4000
	#Internal steam buffer of the Bronze Steam Chemical machine, in mB
	# Default: 2000
	# Range: 1 ~ 9223372036854775807
	steam_capacity_bronze = 2000

[mekanism]
	#Whether a chemical multiblock machine is registered for every bridged Mekanism recipe type.
	#Turning this off also keeps the recipe types from being registered.
	enable_machines = false
	#Whether the energy converter generator is registered. It burns the items that Mekanism's
	#energy_conversion recipes accept and pushes EU into its energy output hatches.
	enable_generator = false
	#Whether the Mekanism machine recipe types are registered, so that chemical machines can run
	#Mekanism's own recipes (crushing, oxidizing, infusing, ...).
	enable_recipe_types = false
	#EU per tick the energy converter generator can produce
	# Default: 64
	# Range: 1 ~ 9223372036854775807
	generator_eu_per_tick = 64
	#How much EU one Joule of Mekanism energy is worth. Mekanism uses 1 J = 0.4 FE and MI's EU
	#= 10 FE by default, so the default of 0.04 is the exact conversion.
	# Default: 0.04
	# Range: 0.0 ~ 1000.0
	joules_to_eu = 0.04
